<svg xmlns="http://www.w3.org/2000/svg" width="860" height="40" viewBox="0 0 860 40" role="img" aria-label="~/projetos">
<title>~/projetos</title>
<style>

text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 19px; font-weight: 600; }
.base { stroke: #30363d; stroke-width: 1.5; }
.brilho { stroke: #3fb950; stroke-width: 1.5; stroke-dasharray: 90 860; animation: corre 6s linear infinite; }
.cursor { fill: #3fb950; animation: pisca 1.1s steps(1) infinite; }
@keyframes corre { from { stroke-dashoffset: 90; } to { stroke-dashoffset: -860; } }
@keyframes pisca { 50% { opacity: 0; } }

</style>
<text x="2" y="27" fill="#3fb950">❯</text><text x="26" y="27" fill="#58a6ff">~/projetos</text><rect class="cursor" x="160.0" y="12" width="9" height="18"/><line class="base" x1="178.0" y1="21" x2="860" y2="21"/><line class="brilho" x1="178.0" y1="21" x2="860" y2="21"/>
</svg>
